  - "<button onClick={save}>Сохранить</button>"
  - '<input type="file" hidden />'
  - "<textarea />"
  - "<select><option>PDF</option></select>"
  - '<label htmlFor="name">Название</label>'
  - "<table><tbody><tr><td>Текст</td></tr></tbody></table>"
