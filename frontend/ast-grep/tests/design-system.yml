  - 'import type { DialogProps } from "@radix-ui/react-dialog";'
  - 'import { Select } from "../_designSystem/Select";'
---
id: surfaces-via-ui
valid:
  - '<Card className="rounded-xl border bg-card" />'
  - '<section className="grid gap-4"><Card /></section>'
  - 'const example = "rounded-xl border bg-card";'
invalid:
  - '<div className="rounded-xl border bg-card p-4" />'
  - '<section className={cn(active && "border rounded-lg bg-card")} />'
  - '<aside className={`rounded-xl border bg-card ${active ? "ring-1" : ""}`} />'
