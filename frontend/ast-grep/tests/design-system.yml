id: controls-via-ui
valid:
  - "<Button onClick={save}>Сохранить</Button>"
  - '<Input type="file" hidden />'
  - "<CardButton>Открыть</CardButton>"
  - "<Table><TableBody><TableRow><TableCell>Текст</TableCell></TableRow></TableBody></Table>"
  - "// <button> — пример в комментарии"
