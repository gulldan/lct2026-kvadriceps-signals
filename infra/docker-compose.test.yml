# Временные бэкенды для интеграций, которые не подделать в процессе: репозитории db-service
# (DB_TEST_DSN) и брокер platform (RABBITMQ_TEST_URL). Порты хоста сдвинуты на +1 от dev-стека,
# чтобы работать рядом с `make up`.
name: rag-test-infra

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: test-postgres-password
      POSTGRES_DB: rag
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    ports: ["5673:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
