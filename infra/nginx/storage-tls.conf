# Части больших файлов подписаны адресом S3: отдельный порт сохраняет путь и Host подписи.
server {
    listen 444 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /run/frontend-tls/fullchain.pem;
    ssl_certificate_key /run/frontend-tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:frontend_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 600m;
    proxy_read_timeout 300s;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $storage_upstream http://localstack:4566;
        proxy_pass $storage_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
