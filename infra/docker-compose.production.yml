# Добавляется к базовому compose; сертификаты выдаёт отдельная доверенная CA.
services:
  db-service:
    environment:
      AUTOMATION_USERNAME: ${AUTOMATION_USERNAME:-automation}
      AUTOMATION_PASSWORD: ${AUTOMATION_PASSWORD:?set a distinct automation password}
      APP_ENV: production
      GRPC_TLS_MODE: mtls
      GRPC_SERVICE_ID: db-service
      GRPC_TLS_CA: /run/rpc/ca.pem
      GRPC_TLS_CERT: /run/rpc/service.pem
      GRPC_TLS_KEY: /run/rpc/service.key
    volumes:
      - ${RAG_PKI_DIR:?set RAG_PKI_DIR}/ca.pem:/run/rpc/ca.pem:ro
      - ${RAG_PKI_DIR:?set RAG_PKI_DIR}/db-service.pem:/run/rpc/service.pem:ro
      - ${RAG_PKI_DIR:?set RAG_PKI_DIR}/db-service.key:/run/rpc/service.key:ro
